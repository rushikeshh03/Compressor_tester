; Coulomb Harness Tester — Waveshare ESP32-S3-Touch-LCD-7 (ST7262 800x480 RGB
; + GT911 touch). LVGL v8.3.x + CAN (TWAI) + ESP32_Display_Panel Board class
; + ABMS-compatible CAN OTA bootloader.
;
; Config lives in include/app_config.h:
;   CONFIG_CAN_BAUD_KBPS  125/250/500 default baud (runtime-overridable, 0x2CC)
;   CONFIG_FW_VERSION     firmware version string (status watermark)
;   CONFIG_FACTORY_WIFI*  factory-mode WiFi service (web firmware updater)
; USB-CDC is pinned OFF here (build_flags) because the native USB is a HOST for
; the USB-HID barcode scanner. CAN runs on an external TJA1050 (GPIO43/44).
;
; PLATFORM NOTE:
;   The official PlatformIO espressif32 platform (all 6.x versions) ships
;   arduino-esp32 2.0.x / IDF 4.4, which is missing LCD_RGB_ELEMENT_ORDER_RGB.
;   ESP32_Display_Panel v1.x requires IDF 5.x. The pioarduino platform fork
;   ships arduino-esp32 3.x / IDF 5.x and is the correct platform to use.
;
; PARTITION NOTE:
;   Requires THREE slots — factory + ota_0 + ota_1 (see partitions.csv, set via
;   board_build.partitions below). The app runs from ota_0/ota_1; the CAN-flash
;   bootloader runs from the factory partition, so a two-slot table like
;   default_16MB.csv will NOT work. The otadata partition must also be present.
;
;   The firmware binary to send over CAN is:
;     .pio/build/waveshare_esp32s3/firmware.bin
;   Compute CRC-32 (poly 0xEDB88320, init/finalXOR 0xFFFFFFFF) over that file
;   and send it in the VERIFY command — identical to how ABMS is flashed.

[env:waveshare_esp32s3]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
; ⚠ IOT-PARITY: factory + ota_0 + ota_1 layout, kept IDENTICAL to the IOT code.
;   The running app lives in app0 (ota_0); the CAN-flash bootloader runs from
;   the factory partition; app1 (ota_1) holds the app0 backup. Changing the
;   partitions or flash flow here means the same change is needed in IOT code.
board_build.partitions          = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---- First flash ----
; (The full_flash.bin auto-build + `upload_full` target were removed — default
;  `pio run` / `pio run -t upload` behaviour only. For a first flash onto the
;  factory+ota_0+ota_1 layout, write the per-partition images by hand — see the
;  esptool offsets in partitions.csv.)

; ---- Libraries ----
lib_deps =
    lvgl/lvgl @ ^8.3.11
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    ; USB-HID host to read the USB barcode scanner (the LCD's sole barcode input;
    ; BLE was removed). Uses usb/usb_host.h + esp_private/usb_phy.h bundled with
    ; arduino-esp32 3.x.
    tanakamasayuki/EspUsbHost

; ---- Framework sdkconfig overrides (PSRAM offload for WiFi+BLE coexistence) ----
; WiFi (~42 KB) + NimBLE (~90 KB) do NOT both fit in internal RAM on this board.
; Moving NimBLE's host heap + WiFi/LWIP buffers into PSRAM fixes it — BUT this
; triggers a from-source ESP-IDF rebuild, and ESP-IDF REJECTS spaces in the
; project path ("Detected a whitespace character in project paths"). This project
; currently lives under "...\My Drive\...\Harness testing" (spaces), and a
; directory junction does not help (realpath follows it back to the spaced path).
; To enable this, the project must physically reside at a space-free path
; (e.g. C:\dev\HarnessTester), then uncomment:
;   custom_sdkconfig =
;       CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
;       CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y

; ---- C++ standard ----
build_unflags =
    -std=gnu++11

; ---- Build flags ----
build_flags =
    -DBOARD_HAS_PSRAM
    ; Native USB (GPIO19/20) is a HOST for the USB-HID scanner, so USB-CDC MUST be
    ; off (a CDC device would fight the host stack for the OTG peripheral). CAN is
    ; on the external TJA1050 (GPIO43/44).
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; C++17 required by ESP32_Display_Panel (std::variant, std::optional)
    -std=gnu++17
    ; LVGL
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; ESP_Display_Panel: tell library to use our custom board conf
    -DESP_PANEL_BOARD_DEFAULT_USE_CUSTOM=1
    ; Include paths
    -I src
    -I src/ui
    -I include
    ; Stack size for LVGL + RGB LCD + BLE central init in setup()
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Enable IDF OTA API (should be on by default, explicit for clarity)
    -DCONFIG_ESP_OTA_ALLOW_HTTP=1