; CAN_Bridge — ESP32-WROOM UART<->CAN transparent bridge for the Harness Tester LCD.
; Board: ESP32 Dev Module (esp32dev). Native TWAI + an external CAN transceiver on
; GPIO4(RX)/GPIO5(TX). No extra libraries — TWAI ships with the Arduino core.
[env:esp32dev]
platform      = espressif32@6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
    -DCORE_DEBUG_LEVEL=0
